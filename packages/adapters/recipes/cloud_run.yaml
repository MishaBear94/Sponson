# yaml-language-server: $schema=../../../schema/recipe.schema.json
# Google Cloud Run Admin API v2 recipes. Format and checklist: docs/adr/0020-recipes.md, CONTRIBUTING.md "Adding a recipe".
provider: cloud_run
title: Google Cloud Run
category: deploy
verified_on: "2026-10-11"
docs:
  - title: "REST Resource: projects.locations.services (Service, TrafficTarget)"
    url: https://docs.cloud.google.com/run/docs/reference/rest/v2/projects.locations.services
  - title: "Method: projects.locations.services.patch"
    url: https://docs.cloud.google.com/run/docs/reference/rest/v2/projects.locations.services/patch
  - title: "Method: projects.locations.services.get"
    url: https://docs.cloud.google.com/run/docs/reference/rest/v2/projects.locations.services/get
  - title: Rollbacks, gradual rollouts, and traffic migration (tags)
    url: https://cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
  - title: gcloud auth print-access-token
    url: https://cloud.google.com/sdk/gcloud/reference/auth/print-access-token
api:
  base_url: https://run.googleapis.com/v2
  base_url_env: CLOUD_RUN_API_URL
  auth: { command: [gcloud, auth, print-access-token] }
assumptions:
  - id: CR1
    verified: true
    text: "`GET https://run.googleapis.com/v2/projects/{project}/locations/{location}/services/{service}` answers the Service with its `traffic` list and an `etag`, 'a system-generated fingerprint for this version of the resource' that 'may be used to detect modification conflict during updates'."
    source: https://docs.cloud.google.com/run/docs/reference/rest/v2/projects.locations.services
  - id: CR2
    verified: true
    text: "`PATCH https://run.googleapis.com/v2/{service.name}` takes a Service and an optional `updateMask` (fields to update), answers a long-running Operation, and needs the `cloud-platform` scope; the recipe sends `?updateMask=traffic` with `{ traffic, etag }` only, so the revision template is never written."
    source: https://docs.cloud.google.com/run/docs/reference/rest/v2/projects.locations.services/patch
  - id: CR3
    verified: true
    text: "A TrafficTarget is `{ type, revision, percent, tag }`; `type: TRAFFIC_TARGET_ALLOCATION_TYPE_REVISION` sends traffic to the named `revision`, `percent` defaults to zero, and `tag` is 'a string to be part of the URI to exclusively reference this target', which is the per-PR URL."
    source: https://docs.cloud.google.com/run/docs/reference/rest/v2/projects.locations.services
  - id: CR4
    verified: true
    text: "`gcloud auth print-access-token` prints an OAuth access token for the active account, sent as a bearer token."
    source: https://cloud.google.com/sdk/gcloud/reference/auth/print-access-token
  - id: CR5
    verified: false
    text: "A patch whose `etag` no longer matches (a deploy changed the service after the read) is refused (409 ABORTED or 412) rather than applied: the line fails and the next apply reads again, so a concurrent `gcloud run deploy` is never overwritten. Sponson's own writers are serialised by the parent lock."
  - id: CR6
    verified: false
    text: "The Service answered right after the patch's Operation is accepted already shows the new `traffic` (the desired state), so the re-read that confirms the write sees the tag; `percent` 0 is left out of the answer and `type` and `revision` are answered as sent."
  - id: CR7
    verified: false
    text: "The revision a tag points to exists before the line applies: the PR's deploy creates it (`gcloud run deploy --no-traffic --revision-suffix <scope>` gives `<service>-<scope>`). Its environment variables are part of that revision, set by the deploy, not by this recipe; a deploy that tags (`--tag`) itself conflicts with this line's tag."
ops:
  traffic_tag:
    kind: list_item
    title: Traffic tag of a revision
    summary: "A tag (`pr-42`) in a service's `traffic` list pointing at the PR's revision with no traffic share, which gives the revision its own URL (`https://pr-42---<service>-<hash>.a.run.app`). Read-modify-write of `traffic` only (`updateMask=traffic`), sent with the service's `etag` so a concurrent deploy makes the write fail instead of being overwritten (CR5); other tags and the traffic split are left alone, and destroy removes only this tag. The revision itself, and its environment variables, are the deploy's (CR7)."
    covers: []
    params:
      project:
        type: string
        required: true
        description: The Google Cloud project id.
        example: demo-project
      region:
        type: string
        required: true
        description: The service's region.
        example: us-central1
      service:
        type: string
        required: true
        description: The Cloud Run service's name.
        example: web
      tag:
        type: string
        required: true
        pattern: "^[a-z][a-z0-9-]*$"
        description: The tag, the prefix of the revision's own URL.
        example: "${ctx.scope}"
      revision:
        type: string
        required: true
        description: The revision the tag points to (made by the PR's deploy).
        example: "web-${ctx.scope}"
    http:
      parent:
        path: "/projects/{project}/locations/{region}/services/{service}?updateMask=traffic"
        read_path: "/projects/{project}/locations/{region}/services/{service}"
        method: PATCH
        send: [etag]
      list_path: /traffic
      key_field: tag
      item: { tag: { param: tag }, revision: { param: revision }, type: TRAFFIC_TARGET_ALLOCATION_TYPE_REVISION }
    sim:
      objects:
        "/projects/{project}/locations/{region}/services/{service}":
          name: projects/demo-project/locations/us-central1/services/web
          etag: '"sim-etag-1"'
          traffic: [{ type: TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST, percent: 100 }]
    live:
      params: { project: SPONSON_LIVE_GCP_PROJECT, region: SPONSON_LIVE_CLOUD_RUN_REGION, service: SPONSON_LIVE_CLOUD_RUN_SERVICE, revision: SPONSON_LIVE_CLOUD_RUN_REVISION }

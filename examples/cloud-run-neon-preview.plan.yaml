# yaml-language-server: $schema=https://raw.githubusercontent.com/MishaBear94/Sponson/main/schema/release.plan.schema.json
#
# A Neon branch per pull request, and a revision of the Cloud Run service `web` per pull request that uses it:
# the image CI built for this commit, the branch's connection string, tagged `pr-42` (the scope) and serving no
# traffic. Its own URL is the `url` output. Needs gcloud on PATH, logged in (in GitHub Actions:
# google-github-actions/auth, then setup-gcloud), and NEON_API_KEY.
version: 1
environments: [preview, production]
providers:
  neon: { project: proj_acme_web }
  cloud_run: { project: acme-web-prod, region: europe-west1 }

changes:
  - id: db
    adapter: neon
    op: branch
    environments: [preview]

  # Production's traffic stays where it is. This assumes it is on a named revision
  # (`gcloud run services update-traffic web --to-revisions=<revision>=100`). If it follows LATEST, the line is
  # refused until you pin it yourself or add `pin_latest: true`, which pins LATEST's share to the revision serving it;
  # see docs/plan-format.md#cloud_runrevision for what that means for later production deploys.
  - id: preview
    adapter: cloud_run
    op: revision
    service: web
    image: "europe-west1-docker.pkg.dev/acme-web-prod/web/app:${ctx.git.sha}"
    env:
      DATABASE_URL: { from: db.connection_string }
      SESSION_SECRET: { secret: "env://PREVIEW_SESSION_SECRET" }
      APP_ENV: preview
    environments: [preview]

  # The preview's own URL, for anything that needs it: here, a callback allowed on the Clerk instance.
  - id: callback
    adapter: clerk
    op: redirect_allow
    url: { from: preview.url }
    environments: [preview]

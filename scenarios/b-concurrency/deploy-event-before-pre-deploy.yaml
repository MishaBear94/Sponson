name: deployment_status 先于前半段到达：后半段等待而不是跳过
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
chaos: { deploy: never }
steps:
  - run: apply --json
    expect:
      exit: 0
      status: partial
      lines: { db: applied, env: applied, callback: waiting }
      stdout: ["\"waitingFor\": \"deploy\""]
  - chaos: { deploy: ok }
  - run: apply --json
    expect:
      exit: 0
      status: complete
      lines: { db: unchanged, env: unchanged, callback: applied }

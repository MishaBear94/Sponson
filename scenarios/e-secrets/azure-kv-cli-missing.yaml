name: "azure-kv:// without the az CLI: the line is blocked naming the reference, nothing is written"
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: env
      adapter: vercel
      op: env
      target: preview
      values: { STRIPE_KEY: { secret: "azure-kv://shop-prod-kv/stripe-key" } }
env: { PATH: "/sponson-scenario-no-such-dir" }
steps:
  - run: plan --json
    expect:
      exit: 1
      plan_lines: { env: blocked }
      errors: { env: "^azure-kv://shop-prod-kv/stripe-key: the `az` CLI is not installed or not on PATH$" }
  - run: apply --json
    expect:
      exit: 1
      status: failed
      lines: { env: blocked }
      errors: { env: "azure-kv://shop-prod-kv/stripe-key" }
      writes: 0

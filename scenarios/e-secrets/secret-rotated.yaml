name: plan 和 apply 之间密钥轮换：警告并使用新值，回执记两个指纹
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: env
      adapter: vercel
      op: env
      target: preview
      values: { STRIPE_KEY: { secret: "env://STRIPE_KEY" } }
env: { STRIPE_KEY: "sk_old_0000000000" }
secrets: ["sk_old_0000000000", "sk_new_1111111111"]
steps:
  - run: apply --json
    expect: { exit: 0 }
  - env: { STRIPE_KEY: "sk_new_1111111111" }
  - run: apply --json
    expect:
      exit: 0
      lines: { env: applied }
      warnings: ["secret env://STRIPE_KEY changed since the last apply"]
  - sim:
      vercel_env: { preview: { STRIPE_KEY: "sk_new_1111111111" } }

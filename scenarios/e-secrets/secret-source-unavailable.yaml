name: "secret unavailable: that line fails, lines depending on it are skipped, the missing variable is named"
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: env
      adapter: vercel
      op: env
      target: preview
      values: { STRIPE_KEY: { secret: "env://MISSING_KEY" } }
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
    - id: unrelated
      adapter: neon
      op: branch
steps:
  - run: apply --json
    expect:
      exit: 1
      status: failed
      lines: { env: blocked, callback: skipped }
      errors: { env: "MISSING_KEY", callback: "depends on `env`" }
      writes: 0

name: 密钥取不到：该行失败，依赖它的行 skipped，说明缺哪个变量
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: env
      adapter: vercel
      op: env
      target: preview
      values: { STRIPE_KEY: { secret: "env://MISSING_KEY" } }
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
    - id: unrelated
      adapter: neon
      op: branch
steps:
  - run: apply --json
    expect:
      exit: 1
      status: failed
      lines: { env: failed, callback: skipped }
      errors: { env: "MISSING_KEY", callback: "depends on `env`" }
      writes: 0

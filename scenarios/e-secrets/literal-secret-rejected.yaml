name: "secret written as plaintext: plan rejects it and tells the agent how to write it"
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: env
      adapter: vercel
      op: env
      target: preview
      values: { STRIPE_KEY: "fake_lv_abcdef" }
secrets: ["fake_lv_abcdef"]
steps:
  - run: plan
    expect: { exit: 2, stderr: ["SECRET_LITERAL", "looks like a secret", "env://STRIPE_KEY"] }
  - run: apply --json
    expect: { exit: 2, error: SECRET_LITERAL, writes: 0 }

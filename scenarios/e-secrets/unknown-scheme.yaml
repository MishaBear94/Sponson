name: "unknown secret scheme: the line is blocked and the message lists the known schemes"
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: env
      adapter: vercel
      op: env
      target: preview
      values: { STRIPE_KEY: { secret: "nosuch://x/y" } }
steps:
  - run: apply --json
    expect:
      exit: 1
      lines: { env: blocked }
      errors: { env: "nosuch://x/y: No secret source for `nosuch://`.*env://" }

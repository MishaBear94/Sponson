name: 三行计划一次跑完：分支、变量、回调
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
secrets: ["neondb_owner:pw_"]
steps:
  - run: plan --json
    expect:
      exit: 0
      plan_lines: { db: create, env: pending, callback: pending }
  - run: apply --json
    expect:
      exit: 0
      status: complete
      lines: { db: applied, env: applied, callback: applied }
  - sim:
      neon_branches: { "sponson/preview/pr-42": exists }
      vercel_env: { preview: { DATABASE_URL: exists } }
      write_order: ["POST /neon", "POST /vercel", "POST /clerk"]
  - run: plan --json
    expect:
      exit: 0
      plan_lines: { db: unchanged, env: unchanged, callback: unchanged }
  - run: apply --json
    expect:
      exit: 0
      writes: 0
      lines: { db: unchanged, env: unchanged, callback: unchanged }
  - run: plan
    expect:
      exit: 0
      stdout: ["= db", "unchanged"]

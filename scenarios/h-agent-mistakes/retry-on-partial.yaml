name: "agent retries on partial: idempotent, harmless"
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
chaos: { deploy: never }
steps:
  - run: apply --json
    expect: { exit: 0, status: partial }
  - run: apply --json
    expect: { exit: 0, status: partial, writes: 0 }
  - run: apply --json
    expect: { exit: 0, status: partial, writes: 0 }

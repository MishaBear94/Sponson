name: "agent adds the production approval itself: the mechanism allows it but SKILL forbids it; without the flag, zero writes"
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: env
      adapter: vercel
      op: env
      target: production
      values: { FEATURE: "on" }
      environments: [production]
ctx: { env: production, pr: 9 }
steps:
  - run: apply --json
    expect: { exit: 2, error: ENV_NOT_APPROVED, writes: 0 }

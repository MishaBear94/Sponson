name: "http auth header with a prefix (Flagsmith `Api-Key <key>`) and several credential headers (Datadog API and application keys); no key ever leaks"
plan: |
  version: 1
  providers:
    http:
      flagsmith:
        base_url: https://api.flagsmith.com/api/v1
        base_url_env: REST_API_URL
        auth: { header: Authorization, value_env: FLAGSMITH_API_KEY, prefix: "Api-Key " }
      datadog:
        base_url: https://api.datadoghq.com/api/v1
        base_url_env: REST_API_URL
        auth:
          headers:
            - { header: DD-API-KEY, value_env: DATADOG_API_KEY }
            - { header: DD-APPLICATION-KEY, value_env: DATADOG_APP_KEY }
  changes:
    - id: flag
      adapter: http
      op: resource
      api: flagsmith
      find: { path: /flags, list_path: /data, match: { name: "checkout-${ctx.scope}" } }
      create: { path: /flags }
      delete: { path: "/flags/{id}" }
      item_path: /data
      fields: { enabled: true }
    - id: monitor
      adapter: http
      op: resource
      api: datadog
      find: { path: /hooks, list_path: /data, match: { name: "preview-${ctx.scope}" } }
      create: { path: /hooks }
      delete: { path: "/hooks/{id}" }
      item_path: /data
      fields: { url: "https://${ctx.scope}.preview.example.app/health" }
seed:
  rest:
    collections: { /flags: [], /hooks: [] }
    auth:
      # Each set is complete on its own: the Flagsmith key behind its prefix, or both Datadog keys.
      headers:
        - { authorization: "Api-Key fs_server_key_0042" }
        - { dd-api-key: dd_api_key_0042, dd-application-key: dd_application_key_0042 }
env:
  FLAGSMITH_API_KEY: fs_server_key_0042
  DATADOG_API_KEY: dd_api_key_0042
  DATADOG_APP_KEY: dd_application_key_0042
secrets: [fs_server_key_0042, dd_api_key_0042, dd_application_key_0042, dd_wrong_application_key_9999]
steps:
  - run: plan --json
    expect: { exit: 0, plan_lines: { flag: create, monitor: create } }
  - run: apply --json
    expect: { exit: 0, status: complete, lines: { flag: applied, monitor: applied } }
  - run: apply --json
    expect: { exit: 0, writes: 0, lines: { flag: unchanged, monitor: unchanged } }
  # One of the two Datadog keys wrong: refused, and neither key appears in the error.
  - env: { DATADOG_APP_KEY: dd_wrong_application_key_9999 }
  - run: plan --json
    expect: { exit: 1, plan_lines: { flag: unchanged, monitor: error }, errors: { monitor: "401" } }
  - env: { DATADOG_APP_KEY: dd_application_key_0042 }
  - run: apply --destroy --json
    expect: { exit: 0, status: complete, lines: { flag: destroyed, monitor: destroyed } }
  - sim:
      state:
        rest.collections./flags: { length: 0 }
        rest.collections./hooks: { length: 0 }

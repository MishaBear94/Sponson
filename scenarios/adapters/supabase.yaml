# Generated by `pnpm new:adapter supabase`: the Supabase adapter end to end through the CLI against the sim.
# Format: see the top of scenarios/runner.test.ts.
name: "supabase: create, apply twice without writes, drift refused until --reconcile, destroy"
plan: |
  version: 1
  providers:
    supabase: { project: demo }
  changes:
    - id: item
      adapter: supabase
      op: item
      value: hello
      environments: [preview]
steps:
  - run: plan --json
    expect:
      exit: 0
      plan_lines: { item: create }
  - run: apply --json
    expect:
      exit: 0
      status: complete
      lines: { item: applied }
      outputs: { item: { value: hello } }
  - sim:
      write_order: ["POST /supabase/projects/demo/items"]
      # Any provider's sim state, by dotted path (see the header of scenarios/runner.test.ts).
      state:
        "supabase.projects.demo.items": { includes: { value: hello } }
  - run: apply --json
    expect:
      exit: 0
      writes: 0
      lines: { item: unchanged }
  # A human edits the value in the Supabase console: plan reports it, apply refuses it until --reconcile.
  - chaos:
      drift: { "supabase.item.sponson-preview-pr-42": "edited" }
  - run: plan --json
    expect:
      exit: 1
      drift: [{ kind: changed, line: item }]
      plan_lines: { item: blocked }
  - run: apply --json
    expect:
      exit: 1
      status: failed
      lines: { item: blocked }
      errors: { item: "reconcile" }
  - run: apply --reconcile --json
    expect:
      exit: 0
      status: complete
      lines: { item: applied }
      outputs: { item: { value: hello } }
  - run: apply --destroy --json
    expect:
      exit: 0
      status: complete
      lines: { item: destroyed }
  - sim:
      write_order: ["POST /supabase", "PATCH /supabase", "DELETE /supabase/projects/demo/items/"]
      state:
        "supabase.projects.demo.items": { length: 0 }

# A PlanetScale password's connection string into a Vercel preview variable, by reference. PlanetScale shows the
# plaintext only when the password is created (PS8), so the output is `once` (docs/adr/0017-once-only-outputs.md):
# it reaches `env` in the run that creates the password; later runs keep what `env` holds, write nothing, and never
# re-create the password to get the value back. Format: see the top of scenarios/runner.test.ts.
name: "planetscale → vercel: DATABASE_URL by reference; re-apply writes nothing; a lost variable is refused, never rotated"
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    planetscale: { organization: acme, database: app }
  changes:
    - id: db
      adapter: planetscale
      op: branch
      environments: [preview]
    - id: dbpw
      adapter: planetscale
      op: password
      branch: { from: db.name }
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: dbpw.connection_string }
      environments: [preview]
# Every simulated plaintext starts with this: it must never reach stdout, stderr or a receipt (I1).
secrets: ["pscale_pw_sim_"]
steps:
  - run: plan --json
    expect:
      exit: 0
      plan_lines: { db: create, dbpw: pending, env: pending }
  - run: apply --json
    expect:
      exit: 0
      status: complete
      lines: { db: applied, dbpw: applied, env: applied }
  - sim:
      vercel_env: { preview: { DATABASE_URL: exists } }
      write_order: ["POST /planetscale/organizations/acme/databases/app/branches", "/passwords", "POST /vercel/v10/projects/prj_demo/env"]
  # The plaintext is gone, and `env` already holds it: unchanged, not pending, and zero writes.
  - run: plan --json
    expect:
      exit: 0
      plan_lines: { db: unchanged, dbpw: unchanged, env: unchanged }
  - run: apply --json
    expect:
      exit: 0
      status: complete
      writes: 0
      lines: { db: unchanged, dbpw: unchanged, env: unchanged }
  # The password is deleted in the console: the next apply creates a new one and passes its value on in that run.
  - chaos:
      drift: { "planetscale.password.sponson-preview-pr-42.sponson-preview-pr-42": "delete" }
  - run: apply --json
    expect:
      exit: 0
      status: complete
      lines: { db: unchanged, dbpw: applied, env: applied }
  - run: apply --json
    expect: { exit: 0, writes: 0, lines: { dbpw: unchanged, env: unchanged } }
  # The Vercel variable is deleted: `env` would need the plaintext, which no later run has. Refused, nothing
  # written, and the password is not re-created behind anyone's back.
  - chaos:
      drift: { "vercel.env.preview.DATABASE_URL": "delete" }
  - run: plan --json
    expect:
      exit: 1
      plan_lines: { dbpw: unchanged, env: blocked }
      errors: { env: "dbpw.connection_string.*earlier run" }
  - run: apply --json
    expect:
      exit: 1
      status: failed
      writes: 0
      lines: { dbpw: unchanged, env: blocked }
      errors: { env: "Nothing was written.*delete it in the provider" }
  # The remedy the message gives: delete the password; the next apply creates a new one and writes it to Vercel.
  - chaos:
      drift: { "planetscale.password.sponson-preview-pr-42.sponson-preview-pr-42": "delete" }
  - run: apply --json
    expect:
      exit: 0
      status: complete
      lines: { dbpw: applied, env: applied }
  - sim:
      vercel_env: { preview: { DATABASE_URL: exists } }
  - run: apply --destroy --json
    expect:
      exit: 0
      status: complete
      lines: { env: destroyed, dbpw: destroyed, db: destroyed }
  - sim:
      vercel_env: { preview: { DATABASE_URL: absent } }
      write_order: ["DELETE /vercel", "DELETE /planetscale/organizations/acme/databases/app/branches/sponson-preview-pr-42/passwords/", "DELETE /planetscale/organizations/acme/databases/app/branches/sponson-preview-pr-42"]
      state:
        "planetscale.organizations.acme.databases.app.branches": { length: 1 }

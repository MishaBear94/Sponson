# The Xata adapter end to end through the CLI against the sim: a copy-on-write branch per scope, waited for until
# healthy (XA5), its connection string into a Vercel preview variable by reference; re-apply without writes; a
# deleted branch re-created and its new connection string passed on; destroy removing only what Sponson made.
# Format: see the top of scenarios/runner.test.ts.
name: "xata.branch: child of the parent, waited for, connection string by reference, recreated when deleted, destroy"
plan: |
  version: 1
  providers:
    xata: { organization: acme, project: app }
    vercel: { project: prj_demo }
  changes:
    - id: db
      adapter: xata
      op: branch
      name: "${ctx.scope}"
      parent_id: br_main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
env:
  SPONSON_XATA_POLL_MS: "5"
seed:
  xata:
    projects:
      "acme/app": [{ id: br_main, name: main }]
    readyPolls: 2
# Every simulated password starts with this: it must never reach stdout, stderr or a receipt (I1).
secrets: ["xata_pw_sim_"]
steps:
  - run: plan --json
    expect:
      exit: 0
      plan_lines: { db: create, env: pending }
  - run: apply --json
    expect:
      exit: 0
      status: complete
      lines: { db: applied, env: applied }
  - sim:
      vercel_env: { preview: { DATABASE_URL: exists } }
      write_order: ["POST /xata/organizations/acme/projects/app/branches", "POST /vercel/v10/projects/prj_demo/env"]
      state:
        "xata.projects.acme/app.branches": { length: 2 }
  - run: apply --json
    expect:
      exit: 0
      writes: 0
      lines: { db: unchanged, env: unchanged }
  # The branch is deleted in the console: missing drift; the next apply creates it again and the variable gets the
  # new connection string in the same run.
  - chaos:
      drift: { "xata.branch.pr-42": "delete" }
  - run: plan --json
    expect:
      exit: 0
      drift: [{ kind: missing, line: db }]
      plan_lines: { db: create }
  - run: apply --json
    expect:
      exit: 0
      status: complete
      lines: { db: applied, env: applied }
  - run: apply --json
    expect: { exit: 0, writes: 0, lines: { db: unchanged, env: unchanged } }
  - run: apply --destroy --json
    expect:
      exit: 0
      status: complete
      lines: { env: destroyed, db: destroyed }
  - sim:
      vercel_env: { preview: { DATABASE_URL: absent } }
      state:
        "xata.projects.acme/app.branches": { length: 1 }

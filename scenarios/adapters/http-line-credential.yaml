# A line credential (ADR 0017, "Line credentials"): a Postmark server per environment (Account API, account token)
# and a webhook of that server (Server API), whose only credential is the server's token, an output of the server
# line. The sim accepts the server API only with a token it generated for a server (R10), so the webhook line can only
# succeed with the value the server line produced. The token never reaches any output (`ApiTokens_sim_` is the prefix
# of every token the sim generates). Lines that would put a credential in the plan, or in receipts, or that could not
# be destroyed from the ledger are refused before any request. Format: see the top of scenarios/runner.test.ts.
name: "http line credential: a Postmark server's webhook authenticated with the server's own token, from its line's output"
plan: |
  version: 1
  changes:
    - id: server
      adapter: http
      op: resource
      recipe: postmark.server
      name: "sponson-${ctx.env}-${ctx.scope}"
    - id: hook
      adapter: http
      op: resource
      recipe: postmark_server.webhook
      url: "https://${ctx.scope}.preview.example.app/api/postmark"
      credential: { from: server.server_token }
      destroy: keep
seed:
  rest:
    collections: { /servers: [], /webhooks: [] }
    styles:
      /servers: { list_path: /Servers, item_path: "", next_path: null, id_field: ID, numeric_ids: true, generated: [/ApiTokens/0] }
      /webhooks: { list_path: /Webhooks, item_path: "", next_path: null, id_field: ID, numeric_ids: true }
    auth:
      headers: [{ x-postmark-account-token: acct_scenario_token_0042 }]
      generated_header: x-postmark-server-token
env:
  POSTMARK_API_URL: "${SIM_URL}/rest"
  POSTMARK_ACCOUNT_TOKEN: acct_scenario_token_0042
secrets: [acct_scenario_token_0042, ApiTokens_sim_]
steps:
  # The server does not exist yet, so neither can its webhooks: nothing is read with a credential that is pending.
  - run: plan --json
    expect: { exit: 0, plan_lines: { server: create, hook: pending } }
  - run: apply --json
    expect: { exit: 0, status: complete, lines: { server: applied, hook: applied } }
  - sim:
      state:
        rest.collections./servers: { length: 1 }
        rest.collections./webhooks: { includes: { Url: "https://pr-42.preview.example.app/api/postmark", MessageStream: outbound } }
      write_order: ["POST /rest/servers", "POST /rest/webhooks"]
  # Later runs read the token from the server (Postmark shows it on every read) and find the webhook with it.
  - run: plan --json
    expect: { exit: 0, plan_lines: { server: unchanged, hook: unchanged } }
  - run: apply --json
    expect: { exit: 0, writes: 0, lines: { server: unchanged, hook: unchanged } }
  # The account token is not the server's: the server API refuses it (the line credential is what authenticates).
  - plan: |
      version: 1
      changes:
        - id: server
          adapter: http
          op: resource
          recipe: postmark.server
          name: "sponson-${ctx.env}-${ctx.scope}"
        - id: hook
          adapter: http
          op: resource
          recipe: postmark_server.webhook
          url: "https://${ctx.scope}.preview.example.app/api/postmark"
          credential: { secret: "env://POSTMARK_ACCOUNT_TOKEN" }
          destroy: keep
  - run: plan --json
    expect: { exit: 1, plan_lines: { server: unchanged, hook: error }, errors: { hook: "401" } }
  # A literal credential would sit in the plan file: refused before any request.
  - plan: |
      version: 1
      changes:
        - id: hook
          adapter: http
          op: resource
          recipe: postmark_server.webhook
          url: "https://${ctx.scope}.preview.example.app/api/postmark"
          credential: not-a-reference-0042
          destroy: keep
  - run: plan --json
    expect: { exit: 2, error: PARAM_INVALID, writes: 0, stdout: ["never a literal credential"] }
  # An output that is not sensitive would show the credential in receipts: refused.
  - plan: |
      version: 1
      changes:
        - id: server
          adapter: http
          op: resource
          recipe: postmark.server
          name: "sponson-${ctx.env}-${ctx.scope}"
        - id: hook
          adapter: http
          op: resource
          recipe: postmark_server.webhook
          url: "https://${ctx.scope}.preview.example.app/api/postmark"
          credential: { from: server.id }
          destroy: keep
  - run: plan --json
    expect: { exit: 2, error: PARAM_INVALID, writes: 0, stdout: ["not a sensitive output"] }
  # Destroy works from the ledger, which never holds the credential: the line must leave its objects to the server.
  - plan: |
      version: 1
      changes:
        - id: server
          adapter: http
          op: resource
          recipe: postmark.server
          name: "sponson-${ctx.env}-${ctx.scope}"
        - id: hook
          adapter: http
          op: resource
          recipe: postmark_server.webhook
          url: "https://${ctx.scope}.preview.example.app/api/postmark"
          credential: { from: server.server_token }
  - run: plan --json
    expect: { exit: 2, error: PARAM_INVALID, writes: 0, stdout: ["destroy: keep"] }
  # Destroy: the webhook is left to the server (KEEP, no request), the server is deleted.
  - plan: |
      version: 1
      changes:
        - id: server
          adapter: http
          op: resource
          recipe: postmark.server
          name: "sponson-${ctx.env}-${ctx.scope}"
        - id: hook
          adapter: http
          op: resource
          recipe: postmark_server.webhook
          url: "https://${ctx.scope}.preview.example.app/api/postmark"
          credential: { from: server.server_token }
          destroy: keep
  - run: apply --destroy --json
    expect: { exit: 0, status: complete, lines: { hook: destroyed, server: destroyed } }
  - sim:
      state:
        rest.collections./servers: { length: 0 }

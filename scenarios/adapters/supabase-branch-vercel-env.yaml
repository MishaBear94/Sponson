# A Supabase preview branch whose connection string and API URL feed a Vercel env line: references compose
# across adapters, and the sensitive output never reaches any output. Format: see the top of scenarios/runner.test.ts.
name: "supabase.branch outputs into a vercel env line: { from: db.connection_string }, destroyed together"
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    supabase: { project: demoprojectrefabcdef }
  changes:
    - id: db
      adapter: supabase
      op: branch
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
        NEXT_PUBLIC_SUPABASE_URL: { from: db.api_url }
      environments: [preview]
    - id: callback
      adapter: supabase
      op: auth_redirect
      url: https://pr-42.preview.example.com/auth/callback
      environments: [preview]
secrets: ["pw_br"]
chaos: { supabase_ready_ms: 100 }
steps:
  - run: plan --json
    expect:
      exit: 0
      plan_lines: { db: create, env: pending, callback: create }
  - run: apply --json
    expect:
      exit: 0
      status: complete
      lines: { db: applied, env: applied, callback: applied }
  - sim:
      vercel_env: { preview: { DATABASE_URL: exists, NEXT_PUBLIC_SUPABASE_URL: exists } }
      write_order: ["POST /supabase/projects/demoprojectrefabcdef/branches", "POST /vercel"]
  - run: plan --json
    expect:
      exit: 0
      plan_lines: { db: unchanged, env: unchanged, callback: unchanged }
  - run: apply --json
    expect:
      exit: 0
      writes: 0
      lines: { db: unchanged, env: unchanged, callback: unchanged }
  - run: apply --destroy --json
    expect:
      exit: 0
      status: complete
      lines: { db: destroyed, env: destroyed, callback: destroyed }
  - sim:
      vercel_env: { preview: { DATABASE_URL: absent, NEXT_PUBLIC_SUPABASE_URL: absent } }
      state:
        "supabase.projects.demoprojectrefabcdef.branches": { length: 1 }
        "supabase.projects.demoprojectrefabcdef.auth.uri_allow_list": "http://localhost:3000/**"

# A Supabase preview branch whose outputs feed other lines: its connection string and API URL into a Vercel env
# line, its ref into an auth_redirect line that allows the preview URL on the branch's own Auth config. References
# compose across adapters, and the sensitive output never reaches any output. Format: see the top of
# scenarios/runner.test.ts.
name: "supabase.branch outputs into a vercel env line ({ from: db.connection_string }) and the branch's own redirect allow-list, destroyed together"
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    supabase: { project: demoprojectrefabcdef }
  changes:
    - id: db
      adapter: supabase
      op: branch
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
        NEXT_PUBLIC_SUPABASE_URL: { from: db.api_url }
      environments: [preview]
    - id: callback
      adapter: supabase
      op: auth_redirect
      project: { from: db.project_ref }
      url: https://pr-42.preview.example.com/auth/callback
      environments: [preview]
secrets: ["pw_br"]
chaos: { supabase_ready_ms: 100 }
steps:
  - run: plan --json
    expect:
      exit: 0
      plan_lines: { db: create, env: pending, callback: pending }
  - run: apply --json
    expect:
      exit: 0
      status: complete
      lines: { db: applied, env: applied, callback: applied }
  - sim:
      vercel_env: { preview: { DATABASE_URL: exists, NEXT_PUBLIC_SUPABASE_URL: exists } }
      write_order: ["POST /supabase/projects/demoprojectrefabcdef/branches", "POST /vercel", "PATCH /supabase/projects/br"]
      state:
        "supabase.projects.demoprojectrefabcdef.branches": { includes: { name: sponson-preview-pr-42, auth: { site_url: "http://localhost:3000", uri_allow_list: "https://pr-42.preview.example.com/auth/callback" } } }
        # The parent project's allow-list is not touched.
        "supabase.projects.demoprojectrefabcdef.auth.uri_allow_list": "http://localhost:3000/**"
  - run: plan --json
    expect:
      exit: 0
      plan_lines: { db: unchanged, env: unchanged, callback: unchanged }
  - run: apply --json
    expect:
      exit: 0
      writes: 0
      lines: { db: unchanged, env: unchanged, callback: unchanged }
  - run: apply --destroy --json
    expect:
      exit: 0
      status: complete
      lines: { db: destroyed, env: destroyed, callback: destroyed }
  - sim:
      vercel_env: { preview: { DATABASE_URL: absent, NEXT_PUBLIC_SUPABASE_URL: absent } }
      state:
        "supabase.projects.demoprojectrefabcdef.branches": { length: 1 }
        "supabase.projects.demoprojectrefabcdef.auth.uri_allow_list": "http://localhost:3000/**"

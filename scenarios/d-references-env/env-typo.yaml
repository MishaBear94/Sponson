name: --env prod 拼错：列出合法环境名
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
ctx: { env: prod }
steps:
  - run: plan
    expect: { exit: 2, stderr: ["ENV_UNKNOWN", "Unknown environment `prod`", "preview, production"] }

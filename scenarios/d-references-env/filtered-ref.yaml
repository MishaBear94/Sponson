name: "a preview line references a production-only line: the error says the environment filter is why"
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      environments: [production]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values: { DATABASE_URL: { from: db.connection_string } }
      environments: [preview]
steps:
  - run: plan
    expect: { exit: 2, stderr: ["REF_FILTERED", "filtered out of this environment", "environments: [production]"] }

name: 销毁：逆序删除，之后 reopen 从零开始
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
steps:
  - run: apply --json
    expect: { exit: 0 }
  - run: apply --destroy --json
    expect: { exit: 0, status: complete, lines: { callback: destroyed, env: destroyed, db: destroyed } }
  - sim:
      neon_branches: { "sponson/preview/pr-42": absent }
      vercel_env: { preview: { DATABASE_URL: absent } }
      clerk_redirects: { "https://prj_demo-01234567.vercel.app": absent }
      write_order: ["DELETE /clerk", "DELETE /vercel", "DELETE /neon"]
  - run: apply --json
    expect: { exit: 0, status: complete, lines: { db: applied, env: applied, callback: applied } }

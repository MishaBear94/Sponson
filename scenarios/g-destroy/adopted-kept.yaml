name: 收编的资源永远不删
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
seed:
  vercel: { projects: { prj_demo: { envs: [{ key: DATABASE_URL, value: old-value, target: preview, gitBranch: feat/x }] } } }
  neon: { projects: { proj_demo: { branches: [{ name: main }, { name: sponson/preview/pr-42, parent: main }] } } }
  clerk: { redirect_urls: [] }
steps:
  - run: apply --json
    expect:
      exit: 0
      lines: { db: unchanged, env: applied, callback: applied }
  - run: apply --destroy --json
    expect:
      exit: 0
      lines: { db: skipped, env: skipped, callback: destroyed }
  - sim:
      neon_branches: { "sponson/preview/pr-42": exists }
      vercel_env: { preview: { DATABASE_URL: exists } }

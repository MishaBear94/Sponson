name: 资源已被手动删：销毁跳过，不报错
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
steps:
  - run: apply --json
    expect: { exit: 0 }
  - chaos: { drift: { "neon.branch.sponson/preview/pr-42": delete, "clerk.redirect.https://prj_demo-01234567.vercel.app": delete } }
  - run: apply --destroy --json
    expect: { exit: 0, status: complete }

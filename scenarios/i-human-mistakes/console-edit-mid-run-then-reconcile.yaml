name: 人在控制台改了又改回：不冲突
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
steps:
  - run: apply --json
    expect: { exit: 0 }
  - chaos: { drift: { "vercel.env.preview.DATABASE_URL": "temp" } }
  - run: plan --json
    expect: { exit: 1, drift: [{ kind: changed, line: env }], plan_lines: { env: blocked } }
  - run: apply --reconcile --json
    expect: { exit: 0, status: complete, notes: { env: { reconciled: true } } }
  - run: plan --json
    expect: { exit: 0, plan_lines: { env: unchanged } }

name: "receipt hand-edited into garbage: reports where, continues as if there were no receipt"
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
steps:
  - run: apply --json
    expect: { exit: 0 }
  - receipt: corrupt
  - run: plan --json
    expect: { exit: 0, warnings: ["not valid JSON", "drift detection is disabled"] }
  - run: apply --json
    expect: { exit: 0, status: complete }
  - run: plan --json
    expect: { exit: 0, warnings: ["^(?![\\s\\S]*not valid JSON)"] }

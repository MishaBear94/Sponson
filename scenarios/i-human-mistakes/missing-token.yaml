name: 缺 token：报错点名环境变量
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
env: { NEON_API_KEY: "" }
steps:
  - run: plan
    expect: { exit: 1, stdout: ["NEON_API_KEY"] }

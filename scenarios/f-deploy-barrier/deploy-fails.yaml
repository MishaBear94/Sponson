name: 部署失败：后半段 skipped，整体 failed，前半段不回滚
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
chaos: { deploy: fail }
steps:
  - run: apply --json
    expect:
      exit: 1
      status: failed
      lines: { db: applied, env: applied, callback: skipped }
      errors: { callback: "failed" }
  - sim:
      neon_branches: { "sponson/preview/pr-42": exists }
      vercel_env: { preview: { DATABASE_URL: exists } }

name: "--wait times out: non-zero exit, no hang"
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
chaos: { deploy: never }
steps:
  - run: apply --wait --wait-timeout 1 --json
    expect:
      exit: 1
      status: failed
      lines: { db: applied, env: applied, callback: waiting }
      errors: { callback: "timed out waiting for deploy" }

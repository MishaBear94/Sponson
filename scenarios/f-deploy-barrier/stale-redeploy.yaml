name: 变量注入晚于构建开始：触发 redeploy 并记录
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
chaos: { deploy: stale }
steps:
  - run: apply --json
    expect:
      exit: 0
      status: complete
      notes: { env: { redeployed: true } }
  - sim:
      deployments: 2
  - run: apply --json
    expect: { exit: 0, writes: 0 }

name: 部署慢：--wait 轮询直到 READY
plan: |
  version: 1
  providers:
    vercel: { project: prj_demo }
    neon: { project: proj_demo }
  changes:
    - id: db
      adapter: neon
      op: branch
      parent: main
      environments: [preview]
    - id: env
      adapter: vercel
      op: env
      target: preview
      values:
        DATABASE_URL: { from: db.connection_string }
      environments: [preview]
    - id: callback
      adapter: clerk
      op: redirect_allow
      url: { from: env.preview_url }
      environments: [preview]
chaos: { deploy: "delay:1" }
steps:
  - run: apply --wait --wait-timeout 10 --json
    expect: { exit: 0, status: complete, lines: { callback: applied } }

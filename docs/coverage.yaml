# The provider coverage matrix: the source of truth for the tables and numbers in docs/coverage.md, which
# `pnpm docs:gen` (scripts/gen-docs.ts) regenerates from this file. Edit rows here, never in the Markdown.
#
# A row is one piece of per-environment SaaS state (scope: docs/coverage.md). Keys:
#   id           stable, kebab-case; recipes name it in their op's `covers`
#   priority     P0 | P1 | P2 (weights below)
#   generic      whether the generic http adapter can express it: Y, P (partly, why) or N (why)
#   covered_by   what manages it today: `<adapter>.<op>` (a registered op), `recipe:<provider>.<op>` (a shipped
#                recipe op), a list of those, `manual.step` (no API reaches it: a person does it, tracked by a
#                manual step line, never counted as automated; `why` says so), `manual` (the same, untracked), or
#                null (not yet). scenarios/docs/coverage.test.ts checks every reference resolves and is tested.
#   counted      false for a row kept for completeness that has nothing to manage (`why` says so)
#   note         shown after the coverage mark
# Secret sources resolve references and create nothing; they are counted separately (covered_by: `secret:<scheme>`).
weights:
  P0: 3
  P1: 2
  P2: 1
categories:
  - id: deploy
    title: Deploy targets and their environment variables
    rows:
      - id: vercel-env
        provider: Vercel
        side_effect: Env vars per target and git branch; wait for the preview deployment, redeploy if it built before the write
        api_shape: REST `/v10/projects/{id}/env`, bearer; object per variable; deployment barrier
        generic: P (barrier, redeploy)
        priority: P0
        covered_by:
          - vercel.env
          - vercel.deploy
      - id: netlify-env
        provider: Netlify
        side_effect: Env var values per deploy context (`deploy-preview`, `branch` + `context_parameter`); wait for the deploy of the commit, rebuild if it started before the write
        api_shape: REST `POST /api/v1/accounts/{account}/env?site_id=`, `PATCH .../env/{key}`; bearer; object per key, values list per context; deploys only see values set before they started
        generic: P (deploy barrier like Vercel)
        priority: P0
        covered_by: netlify.env
      - id: cloudflare-pages-env
        provider: Cloudflare Pages / Workers
        side_effect: "Pages: `deployment_configs.preview.env_vars` (all previews share one set, no per-branch values). Workers: secrets per script / preview version"
        api_shape: REST `PATCH /accounts/{a}/pages/projects/{p}`, bearer; **map** merge-patch, `null` deletes; Workers `PUT .../workers/scripts/{s}/secrets` object
        generic: Y
        priority: P1
        covered_by: cloudflare.pages_env
        note: Pages variables; Workers secrets are not covered
      - id: render-env
        provider: Render
        side_effect: Env vars on a preview service / preview environment
        api_shape: REST `PUT /v1/services/{id}/env-vars/{key}`, bearer; object per key; previews created by Render from `render.yaml`
        generic: Y
        priority: P1
        covered_by: recipe:render.env_var
        note: "per variable on a service whose id the plan gives (Render creates previews itself; no lookup of PR N's service); writing does not deploy"
      - id: railway-variables
        provider: Railway
        side_effect: Variables in a PR environment (Railway creates PR environments natively)
        api_shape: GraphQL `variableUpsert(projectId, environmentId, serviceId, name, value)`, bearer; object per name; deployment status for a barrier
        generic: Y (GraphQL requests; a deploy barrier is not expressible)
        priority: P1
        covered_by: recipe:railway.variable
        note: the PR environment's id is a param; Sponson does not wait for the redeploy a write triggers
      - id: fly-secrets
        provider: Fly.io
        side_effect: Per-PR app (the usual pattern is one app per PR) plus its secrets
        api_shape: Machines API `api.machines.dev/v1/apps/{app}/secrets` (secret writes return a version, changed 2025) and GraphQL `setSecrets`; bearer; object; machines must be updated to see new secrets
        generic: "Y (the app through the Machines API; secrets through GraphQL requests, presence only: values are never readable)"
        priority: P1
        covered_by:
          - recipe:fly_machines.app
          - recipe:fly.secret
        note: secrets before the PR's deploy; a later change needs `fly secrets deploy`
      - id: heroku-config-vars
        provider: Heroku
        side_effect: Review app per PR; config vars on it
        api_shape: REST `POST /review-apps`, `PATCH /apps/{app}/config-vars`, bearer; **map** merge, `null` deletes; review-app creation async
        generic: Y (config vars); P (review app)
        priority: P2
        covered_by: recipe:heroku.config_var
        note: "config vars on an existing app (a review app by name); creating the review app (async, by Heroku's automatic review apps) is not managed"
      - id: amplify-branch
        provider: AWS Amplify
        side_effect: Branch (per-PR previews built in); env vars per branch
        api_shape: "`UpdateBranch` `environmentVariables`, SigV4; **map** full replace"
        generic: Y (`aws_sigv4`, the map sent whole)
        priority: P2
        covered_by:
          - recipe:amplify.branch
          - recipe:amplify.branch_variable
        note: variables before the branch's first build (no rebuild)
      - id: cloud-run-tag
        provider: Google Cloud Run
        side_effect: Tagged revision per PR (`--tag pr-42`), env vars on it
        api_shape: Admin API v2 / `gcloud run deploy --tag --update-env-vars`, Google OAuth; revision = whole service spec
        generic: "P (the tag alone is read-modify-write of `traffic`; a revision needs the service's template copied and an operation polled)"
        priority: P2
        covered_by: cloud_run.revision
        note: "a revision of an existing service per scope from its template, with the plan's image and variables, tagged and given no traffic (traffic on LATEST is pinned only with the line's `pin_latest: true`, refused otherwise); destroy removes the tag and Cloud Run deletes the revision later"
      - id: azure-swa-settings
        provider: Azure Static Web Apps
        side_effect: Preview environment per PR (built in); app settings
        api_shape: ARM `PUT .../staticSites/{s}/builds/{env}/config/appsettings`, AAD token; **map** full replace
        generic: Y (`command` token from `az`; read with a POST list action, the map written whole)
        priority: P2
        covered_by: recipe:azure_swa.build_app_setting
        note: after the PR's first deploy (the environment exists only then)
      - id: digitalocean-app
        provider: DigitalOcean App Platform
        side_effect: No native PR previews; app per PR via its GitHub action; envs in the app spec
        api_shape: REST `PUT /v2/apps/{id}` whole spec, bearer; **list** in spec
        generic: P (whole-spec writes)
        priority: P2
        covered_by: digitalocean.app
        note: "an app per scope from a whole spec, waited for until deployed (in place of the app DigitalOcean's GitHub action makes); secret values are not compared"
  - id: databases
    title: Databases with branching or per-PR instances
    rows:
      - id: neon-branch
        provider: Neon
        side_effect: Copy-on-write branch per PR, connection string out
        api_shape: REST `/api/v2/projects/{p}/branches`, bearer; object; async operations, `423` while busy
        generic: P (async ops)
        priority: P0
        covered_by: neon.branch
      - id: supabase-branch
        provider: Supabase
        side_effect: Preview branch per PR (a separate project with its own ref, keys and URL)
        api_shape: Management API `POST /v1/projects/{ref}/branches`, `GET`/`DELETE /v1/branches/{ref}`, bearer PAT; object; async provisioning (`ACTIVE_HEALTHY`), migrations run by Supabase
        generic: P (async, outputs from a second project)
        priority: P0
        covered_by: supabase.branch
      - id: planetscale-branch
        provider: PlanetScale
        side_effect: Branch per PR; password (credential) per branch; deploy request on merge
        api_shape: REST `POST /v1/organizations/{o}/databases/{d}/branches`, `.../branches/{b}/passwords`; service token header; object; branch `ready` async; password plaintext returned once
        generic: P (async, once-only secret)
        priority: P1
        covered_by:
          - planetscale.branch
          - planetscale.password
        note: deploy requests on merge are not managed
      - id: turso-database
        provider: Turso
        side_effect: "Database branched from a parent (`seed: {type: database}`), token per DB"
        api_shape: Platform API `POST /v1/organizations/{o}/databases`, `.../databases/{d}/auth/tokens`; bearer; object
        generic: Y
        priority: P1
        covered_by: recipe:turso.database_branch
      - id: xata-branch
        provider: Xata
        side_effect: Copy-on-write Postgres branch
        api_shape: "REST `POST https://api.xata.tech/organizations/{o}/projects/{p}/branches` `{mode: inherit, parentID, name}`, `DELETE .../branches/{id}`; bearer API key; object; branch comes up asynchronously (`status.statusType`); credentials from `GET .../branches/{id}/credentials` (OpenAPI at api.xata.tech/openapi.json; re-platformed onto Postgres in 2025)"
        generic: P (async readiness, credentials in a second request)
        priority: P2
        covered_by: xata.branch
        note: "waits until the branch is healthy; only its existence is compared for drift"
      - id: mongodb-atlas-user
        provider: MongoDB Atlas
        side_effect: No branching; per-PR database user and database name on a shared cluster (cluster per PR is slow and costly)
        api_shape: Admin API v2 `POST /api/atlas/v2/groups/{g}/databaseUsers`, digest or service-account OAuth; object
        generic: Y (`digest` auth and `media_type`; tested against a Digest sim in scenarios/adapters/http-digest.yaml)
        priority: P2
        covered_by: recipe:mongodb_atlas.database_user
        note: "the password is an input (`{ secret }`, or a sensitive output of another line), sent on create only and never compared"
      - id: cockroachdb-database
        provider: CockroachDB Cloud
        side_effect: No branching; per-PR database is SQL (`CREATE DATABASE`), a cluster per PR is infra
        api_shape: Cloud API `POST /api/v1/clusters/{c}/databases` (`{ name }`), `DELETE …/databases/{name}`, listed with `pagination.page`; SQL users at `…/sql-users`; bearer; object
        generic: Y (find by name in the list; no SQL needed)
        priority: P2
        covered_by: recipe:cockroachdb.database
        note: "the Cloud API creates databases and SQL users (`cockroachdb.sql_user`, which gets the SQL `admin` role by default); grants narrower than that still need SQL"
      - id: prisma-postgres-database
        provider: Prisma Postgres
        side_effect: Database per PR in a project, connection string per database
        api_shape: Management API `POST /v1/projects/{id}/databases`, `POST /v1/databases/{id}/connections`; service token; object; connection string returned on create
        generic: Y
        priority: P2
        covered_by: ["recipe:prisma.database", "recipe:prisma.database_copy"]
        note: "connection strings are once-only outputs (in the create answer only); Sponson does not wait for status ready"
  - id: auth
    title: Auth callback and redirect allow-lists
    rows:
      - id: clerk-redirect
        provider: Clerk
        side_effect: Preview URL on the instance's redirect allow-list
        api_shape: Backend API `POST /v1/redirect_urls`, `DELETE /v1/redirect_urls/{id}`, bearer secret key; object
        generic: Y
        priority: P0
        covered_by: clerk.redirect_allow
      - id: auth0-callbacks
        provider: Auth0
        side_effect: Preview URL in an application's `callbacks`, `allowed_logout_urls`, `web_origins`, `allowed_origins`
        api_shape: Management API `PATCH /api/v2/clients/{id}`, bearer from client-credentials; **list** (each array replaced whole); no ETag
        generic: Y (list mode, token exchange)
        priority: P0
        covered_by:
          - recipe:auth0.callback_url
          - recipe:auth0.logout_url
          - recipe:auth0.web_origin
          - recipe:auth0.allowed_origin
      - id: supabase-auth-redirect
        provider: Supabase Auth
        side_effect: Preview URL in "Additional Redirect URLs"
        api_shape: Management API `PATCH /v1/projects/{ref}/config/auth` with `uri_allow_list`, bearer; **list** encoded as one comma-separated string; send only that field; no precondition, so the op locks the list (`lockOn`)
        generic: Y (list mode over a delimited string)
        priority: P0
        covered_by: supabase.auth_redirect
      - id: firebase-auth-domains
        provider: Firebase Auth
        side_effect: Preview domain in `authorizedDomains`
        api_shape: Identity Toolkit `PATCH admin/v2/projects/{p}/config?updateMask=authorizedDomains`, Google OAuth; **list** full replace
        generic: Y (list mode, Google token)
        priority: P1
        covered_by: recipe:firebase.authorized_domain
      - id: workos-redirect
        provider: WorkOS
        side_effect: Redirect URI for AuthKit
        api_shape: "`POST /user_management/redirect_uris`, list via `GET` (cursor `list_metadata.after`), `DELETE /user_management/redirect_uris/{id}`; bearer; object"
        generic: Y
        priority: P1
        covered_by: recipe:workos.redirect_uri
      - id: stytch-redirect
        provider: Stytch
        side_effect: Redirect URL per environment
        api_shape: PWA `POST /pwa/v3/projects/{p}/environments/{e}/redirect_urls`, `GET …/redirect_urls/all`, get/update/delete by `?url=`; Basic workspace key; object keyed by its URL
        generic: Y
        priority: P2
        covered_by: recipe:stytch.redirect_url
      - id: okta-redirect
        provider: Okta
        side_effect: "`redirect_uris` on an OIDC app; trusted origin for CORS"
        api_shape: "`PUT /api/v1/apps/{id}` (**list**, whole app object), `POST /api/v1/trustedOrigins` (object); `SSWS` token or OAuth"
        generic: Y (list mode; trusted origins object)
        priority: P2
        covered_by:
          - recipe:okta.redirect_uri
          - recipe:okta.post_logout_redirect_uri
          - recipe:okta.trusted_origin
      - id: kinde-callbacks
        provider: Kinde
        side_effect: Callback and logout URLs on an application
        api_shape: Management API `GET`/`PUT /api/v1/applications/{id}/auth_redirect_urls` and `…/auth_logout_urls` (read `{ redirect_urls }` / `{ logout_urls }`, replace with `{ urls }`; `POST` adds, `DELETE ?urls=` removes); M2M client-credentials token (audience `https://<business>.kinde.com/api`)
        generic: Y (list mode, token exchange; written under another name than read)
        priority: P2
        covered_by:
          - recipe:kinde.callback_url
          - recipe:kinde.logout_url
      - id: google-oauth-redirect
        provider: Google OAuth clients
        side_effect: Preview URL in a web client's authorized redirect URIs
        api_shape: "**No public API** for standard OAuth web clients: created and edited on the Console Clients page only. `gcloud iam oauth-clients` / IAM `projects.locations.oauthClients` (`allowedRedirectUris`) manage Workforce Identity Federation clients only; the IAP OAuth Admin API (IAP-locked clients, redirect URI not updatable) was shut down on 2026-03-19"
        generic: N
        priority: P1
        covered_by: manual.step
        why: "no public API for standard OAuth web clients (re-checked 2026-10-12): Google's web-server guide configures redirect URIs on the Console Clients page only (developers.google.com/identity/protocols/oauth2/web-server), the IAM oauthClients API and `gcloud iam oauth-clients` are 'only for Workforce Identity Federation' (docs.cloud.google.com/iam/docs/workforce-manage-oauth-app, docs.cloud.google.com/iam/docs/reference/rest/v1/projects.locations.oauthClients), and the IAP OAuth Admin API 'was shut down on March 19, 2026' and never allowed updating redirect URIs (docs.cloud.google.com/iap/docs/programmatic-oauth-clients)"
  - id: flags
    title: Feature flags and targeting
    rows:
      - id: launchdarkly-targeting
        provider: LaunchDarkly
        side_effect: "Flag on for a preview: target a context key or add a rule on `url`, in a per-PR or shared preview environment"
        api_shape: "`PATCH /api/v2/flags/{proj}/{flag}` with semantic patch (`Content-Type: application/json; domain-model=launchdarkly.semanticpatch`, instructions `addTargets`/`removeTargets`/`addRule`), API token; instructions are idempotent per target; approvals may gate production"
        generic: P (instruction-based diff, approvals)
        priority: P0
        covered_by: launchdarkly.flag_target
        note: context-key targets; `url` rules not yet
      - id: posthog-release-condition
        provider: PostHog
        side_effect: Release condition matching the preview host on a flag
        api_shape: "`PATCH /api/projects/{id}/feature_flags/{id}` `filters.groups`, personal API key bearer; **list** in `filters`"
        generic: Y (list mode)
        priority: P1
        covered_by: recipe:posthog.release_condition
        note: condition on a person or group property; needs the merging `filters` PATCH of current PostHog (PH5)
      - id: statsig-gate-rule
        provider: Statsig
        side_effect: Gate rule for the preview (condition `url` or `environment_tier`)
        api_shape: Console API `POST /console/v1/gates/{id}/rule` (answers the whole gate), `GET .../rules`, `PATCH`/`DELETE .../rules/{ruleID}`, `STATSIG-API-KEY` header; object per rule; reviews may gate changes
        generic: Y
        priority: P1
        covered_by: recipe:statsig.gate_rule
        note: "gates requiring reviews: write behaviour undocumented (SG8)"
      - id: growthbook-force-rule
        provider: GrowthBook
        side_effect: Force rule in a per-environment feature
        api_shape: REST v2 `POST /api/v2/features/{id}` replacing the top-level `rules` (each rule names its environments; v1's `environments.{env}.rules` is deprecated), bearer; **list**
        generic: Y (list mode)
        priority: P2
        covered_by: recipe:growthbook.force_rule
        note: v2 API (rules with per-rule environments); approval-gated features refuse the write
      - id: unleash-strategy
        provider: Unleash
        side_effect: Strategy (with constraints) on a flag in an environment
        api_shape: Admin API `POST /api/admin/projects/{p}/features/{f}/environments/{env}/strategies`, `DELETE .../{id}`; token header; object
        generic: Y
        priority: P2
        covered_by: recipe:unleash.flag_strategy
        note: deleting the last strategy turns the flag off in that environment (UN8)
      - id: flagsmith-override
        provider: Flagsmith
        side_effect: Segment override or a per-PR environment
        api_shape: "`POST /api/v1/environments/`, feature-state endpoints; `Authorization: Api-Key <key>` (organisation key) or `Token <key>`; object"
        generic: "Y (`Authorization: Api-Key <key>` through the header `prefix`)"
        priority: P2
        covered_by: recipe:flagsmith.environment
        note: "a per-PR environment (its client-side key is an output); identity and segment overrides are not recipes: Edge identities are addressed by UUID, and a segment override is two objects created in order"
      - id: configcat-rule
        provider: ConfigCat
        side_effect: Targeting rule on a setting in an environment
        api_shape: Management API v2 `PUT /v2/environments/{e}/settings/{s}/value` (replaces `defaultValue`, `targetingRules`, `percentageEvaluationAttribute`; `PATCH` is JSON Patch), Basic; **list** of rules
        generic: Y (list mode, PUT with the other fields sent back)
        priority: P2
        covered_by: recipe:configcat.targeting_rule
        note: boolean flags; products requiring a change reason or approval refuse the write
      - id: split-rule
        provider: Split (Harness FME)
        side_effect: Targeting rule / individual target in an environment
        api_shape: Admin API `PUT /internal/api/v2/splits/ws/{ws}/{split}/environments/{env}` (full definition; `PATCH` is JSON Patch), bearer; **list**; same host and paths after the Harness migration
        generic: Y
        priority: P2
        covered_by: recipe:split.targeting_rule
        note: targeting rule (not individual targets); projects requiring title/comment refuse the write
  - id: webhooks
    title: Webhooks registered per environment
    rows:
      - id: stripe-webhook
        provider: Stripe
        side_effect: Test-mode webhook endpoint pointing at the preview URL; its signing secret into the app's env
        api_shape: "`POST /v1/webhook_endpoints` (form-encoded), `DELETE /v1/webhook_endpoints/{id}`; bearer; object; `Idempotency-Key`; **`secret` returned only on create**"
        generic: Y (the secret is a `once` output, flowing into an env line in the same run; ADR 0018)
        priority: P0
        covered_by: recipe:stripe.webhook_endpoint
      - id: github-webhook
        provider: GitHub
        side_effect: Repository webhook to the preview URL
        api_shape: "`POST /repos/{o}/{r}/hooks`, `DELETE .../hooks/{id}`; bearer; object; secret write-only (caller supplies it)"
        generic: Y
        priority: P2
        covered_by: recipe:github.repo_webhook
      - id: svix-endpoint
        provider: Svix (as a sender)
        side_effect: Endpoint per environment on an application
        api_shape: "`POST /api/v1/app/{app}/endpoint` with caller-chosen `uid`; bearer; object, idempotent by `uid`; secret readable via `GET .../secret`"
        generic: Y
        priority: P2
        covered_by: recipe:svix.endpoint
      - id: clerk-webhook
        provider: Clerk webhooks
        side_effect: Preview URL as a webhook endpoint
        api_shape: "Clerk's Backend API has only `POST`/`DELETE /v1/webhooks/svix` (create/delete the instance's Svix app) and `POST /v1/webhooks/svix_url` (a Svix dashboard link); **no endpoint API** through Clerk, and no documented Svix API credential for the Clerk-owned app"
        generic: N
        priority: P1
        covered_by: manual.step
        why: "Clerk's API manages the Svix app, not its endpoints (re-checked 2026-10-12): the Backend API spec (github.com/clerk/openapi-specs, bapi/2025-11-10.yml and 2026-05-12.yml) has only CreateSvixApp, DeleteSvixApp and GenerateSvixAuthURL ('Generate a new URL for accessing the Svix's management dashboard'), the private-beta Platform API (platform/beta.yml) has no webhook routes, the `clerk api ls webhook` route the webhooks overview points agents to (clerk.com/docs/guides/development/webhooks/overview) lists those same three Backend API routes, `clerk webhooks` is a local relay and verifier that makes 'No Clerk API calls' (github.com/clerk/cli, commands/webhooks), and Clerk documents no Svix API token for its app (a portal-URL token is undocumented)"
  - id: email
    title: "Email: sending domains, webhooks, test inboxes"
    rows:
      - id: resend-key-webhook
        provider: Resend
        side_effect: Restricted API key or webhook per environment (domains are long-lived; test addresses like `delivered@resend.dev` need no API)
        api_shape: "`POST /api-keys` (token returned once), `POST /webhooks`; bearer; object"
        generic: Y
        priority: P2
        covered_by:
          - recipe:resend.api_key
          - recipe:resend.webhook
      - id: postmark-server-webhook
        provider: Postmark
        side_effect: Server per environment, webhook per server
        api_shape: Account API `POST /servers` (`X-Postmark-Account-Token`), Server API `POST /webhooks` (`X-Postmark-Server-Token`); object
        generic: "Y (the webhook line takes the server's token with `credential: { from: <server line>.server_token }`)"
        priority: P2
        covered_by:
          - recipe:postmark.server
          - recipe:postmark_server.webhook
        note: "chained in one plan by a line credential (ADR 0017, Line credentials): the webhook line says `destroy: keep`, since its webhooks go with the server; scenarios/adapters/http-line-credential.yaml"
      - id: sendgrid-webhook
        provider: SendGrid
        side_effect: Event webhook or inbound-parse host per environment
        api_shape: "`POST /v3/user/webhooks/event/settings`, `POST /v3/user/webhooks/parse/settings`; bearer; object"
        generic: Y
        priority: P2
        covered_by:
          - recipe:sendgrid.event_webhook
          - recipe:sendgrid.parse_setting
  - id: observability
    title: Observability per release
    rows:
      - id: sentry-release
        provider: Sentry
        side_effect: Release for the commit, deploy record for the environment; finalize
        api_shape: "`POST /api/0/organizations/{o}/releases/`, `POST .../releases/{v}/deploys/`; bearer; object; environments appear on first event"
        generic: Y (destroy = leave; history)
        priority: P1
        covered_by:
          - recipe:sentry.release
          - recipe:sentry.deploy
      - id: datadog-marker
        provider: Datadog
        side_effect: Deployment marker / synthetic test against the preview URL
        api_shape: "`datadog-ci deployment mark`; `POST /api/v1/synthetics/tests/api`; `DD-API-KEY` + `DD-APPLICATION-KEY` headers; object"
        generic: "Y for synthetic tests (`headers` auth; delete by `POST /synthetics/tests/delete` naming the test in its body); N for deployment events (listed by POST over a time window, never deleted)"
        priority: P2
        covered_by: recipe:datadog.synthetic_api_test
        note: "covered by a Synthetic API test against the preview URL; deployment markers stay out of reach (a later run could not find the event it made)"
      - id: honeycomb-marker
        provider: Honeycomb
        side_effect: Marker per deploy in the environment's dataset
        api_shape: "`POST /1/markers/{dataset}`, `X-Honeycomb-Team` header; object"
        generic: Y
        priority: P2
        covered_by: recipe:honeycomb.marker
  - id: dns
    title: DNS and preview domains
    rows:
      - id: cloudflare-dns
        provider: Cloudflare DNS
        side_effect: CNAME `pr-42.preview.example.com` → the preview
        api_shape: "`POST /zones/{z}/dns_records`, `DELETE .../{id}`; bearer; object; no idempotency key, find by name+type"
        generic: Y
        priority: P1
        covered_by: recipe:cloudflare.dns_cname
      - id: vercel-domain
        provider: Vercel domains
        side_effect: Branch-bound project domain (`gitBranch`) for a stable preview hostname
        api_shape: "`POST /v10/projects/{id}/domains` `{name, gitBranch}`, `DELETE`; bearer; object"
        generic: Y (or a `vercel` op)
        priority: P1
        covered_by: recipe:vercel.project_domain
  - id: cors
    title: CORS and allowed origins
    rows:
      - id: supabase-cors
        provider: Supabase
        side_effect: (none) The Data API and Storage have no per-origin allow-list; Edge Functions set CORS in code
        api_shape: n/a, not counted
        generic: n/a
        priority: n/a
        counted: false
        why: "nothing to manage: the Data API and Storage have no per-origin allow-list"
      - id: gcs-cors
        provider: Firebase Storage (GCS bucket)
        side_effect: Preview origin in the bucket's `cors`
        api_shape: GCS JSON API `PATCH /storage/v1/b/{bucket}?fields=cors`, Google OAuth; **list** full replace; `ifMetagenerationMatch` precondition available
        generic: Y (list mode; the precondition is not sent, Sponson's writers are serialised by the parent lock)
        priority: P2
        covered_by: recipe:gcs.bucket_cors
      - id: s3-r2-cors
        provider: S3 / R2
        side_effect: Preview origin in the bucket CORS rules
        api_shape: S3 `PutBucketCors` (SigV4, full replace); R2 `PUT /accounts/{a}/r2/buckets/{b}/cors` (bearer, full replace); **list**
        generic: "Y (S3 API with `aws_sigv4` and `encoding: xml`; R2 through its S3-compatible endpoint)"
        priority: P2
        covered_by: recipe:s3.bucket_cors
  - id: queues
    title: Queues, caches, background jobs
    rows:
      - id: upstash-redis-database
        provider: Upstash Redis
        side_effect: Database per PR, REST URL and token out
        api_shape: Developer API `POST /v2/redis/database`, `DELETE /v2/redis/database/{id}`; Basic (email:key); object
        generic: Y
        priority: P2
        covered_by: recipe:upstash.redis_database
      - id: qstash-schedule
        provider: Upstash QStash
        side_effect: Schedule that calls the preview URL
        api_shape: "`POST /v2/schedules/{destination}` with `Upstash-Schedule-Id` (idempotent upsert), `DELETE /v2/schedules/{id}`; bearer; object"
        generic: Y
        priority: P2
        covered_by: recipe:qstash.schedule
      - id: inngest-sync
        provider: Inngest
        side_effect: Sync the preview deployment into its branch environment
        api_shape: "`PUT {preview_url}/api/inngest` (the app registers itself) or the Vercel integration; branch env selected by `INNGEST_ENV` var"
        generic: Y (one call, no destroy; archive via dashboard)
        priority: P1
        covered_by: recipe:inngest.sync
        note: "an `http.action` (ADR 0022): `PUT` to the deployment's serve endpoint once per deployment URL and revision, no Inngest credential; the app must set `INNGEST_ENV` (automatic on Vercel); nothing to undo (branch environments archive themselves); the beta REST v2 sync endpoint is not used (no way to target a branch environment)"
  - id: search-payments
    title: Search, payments test mode
    rows:
      - id: algolia-index
        provider: Algolia
        side_effect: Index per environment, copied from a template index
        api_shape: "`POST /1/indexes/{src}/operation` `{operation: copy, destination}`, `DELETE /1/indexes/{name}`; `X-Algolia-Application-Id` + `X-Algolia-API-Key`; async task to poll"
        generic: P (async task)
        priority: P2
        covered_by: algolia.index
        note: "copies records, settings, synonyms and rules (or a scope of them) and waits for the copy task; only the index's existence is compared for drift"
      - id: stripe-test-objects
        provider: Stripe test-mode objects
        side_effect: Products / prices / coupons the preview's code expects
        api_shape: "`POST /v1/products`, `/v1/prices` (form-encoded, `lookup_key` as identity, `Idempotency-Key`); prices cannot be deleted, only `active=false`"
        generic: Y (destroy = archive)
        priority: P2
        covered_by:
          - recipe:stripe.product
          - recipe:stripe.price
          - recipe:stripe.coupon
      - id: stripe-sandbox
        provider: Stripe sandboxes
        side_effect: A sandbox per PR
        api_shape: "No public API for sandboxes in your own account (Dashboard only, five per account). `POST /v2/core/claimable_sandboxes` (`Stripe-Version: …preview`, Stripe App with Stripe-approved access) and `stripe sandbox create` (logged out only) make anonymous sandboxes outside your account that expire (60 / 7 days) and have no delete call"
        generic: N
        priority: P2
        covered_by: manual.step
        why: "no public API for sandboxes in your own account (re-checked 2026-10-12): docs.stripe.com/sandboxes/dashboard/manage creates and deletes them in the Dashboard only, up to five per account, the Claimable Sandboxes API (docs.stripe.com/sandboxes/claimable-sandboxes) makes anonymous sandboxes that no existing account owns, for coding platforms that set up Stripe for their users, needs a Stripe App that Stripe reviews, uses a preview API version and has no delete (unclaimed ones are deleted after 60 days), and `stripe sandbox create` (docs.stripe.com/cli/sandbox) provisions an account-less sandbox only when the CLI is logged out ('If you're already logged in, sandbox create opens the sandbox management page in your Stripe Dashboard') that expires after 7 days"

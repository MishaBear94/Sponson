# Sponson GitHub Action
#
# Runs `sponson plan`, `sponson apply` or `sponson apply --destroy` with `--json`, exposes the JSON
# as the `result` output, and on pull_request events upserts one PR comment per environment, rendered from that JSON
# by Sponson's own markdown renderer (render-comment.mjs: the same text as `--format markdown`).
#
# Required workflow permissions:
#   contents: write        apply pushes receipts to the orphan branches `sponson-receipts/<env>/<scope>`
#   pull-requests: write   plan/apply comment on the PR
#
# The same action serves all three triggers: pull_request (opened, synchronize) -> apply,
# deployment_status of a preview deployment with an open PR -> apply (finishes lines that waited on the deploy),
# pull_request (closed) -> destroy. A push to main with env: production applies production (with approved-by).
# See README.md next to this file for the full workflow.

name: Sponson
description: One release, one plan. Plan, apply or destroy everything that ships beside the code.
author: Sponson

inputs:
  command:
    description: plan | apply | destroy
    default: plan
  env:
    description: Environment to plan or apply. Production is never inferred.
    default: preview
  approved-by:
    description: Who approved this run. Required for env=production; supply it from an approval workflow, never from an agent.
    required: false
  plan:
    description: "Path to release.plan.yaml (default: repository root)."
    required: false
  version:
    description: >-
      `source` (default): install and run Sponson from this action's own checkout, so the code that runs is exactly
      the action ref you pinned and nothing is fetched from a package registry. Or an npm version of the `sponson`
      package (e.g. `0.4.0`), installed from npm into the runner's temporary directory.
    default: source
  node-version:
    description: Node.js version to run the CLI with.
    default: "22"
  github-token:
    description: Token used to push receipts and comment on the PR.
    default: ${{ github.token }}

outputs:
  result:
    description: The CLI's JSON output (plan or receipt), verbatim.
    value: ${{ steps.run.outputs.result }}
  status:
    description: For apply/destroy, the receipt status (complete | partial | failed, or stale when a newer commit was already applied). For plan, "ok" or "error".
    value: ${{ steps.run.outputs.status }}
  exit-code:
    description: The CLI's exit code (0 ok, 1 failed, 2 usage/plan/approval, 3 lock held or lost). Empty when skipped.
    value: ${{ steps.run.outputs.exit }}
  skipped:
    description: "\"true\" when the run was skipped: a deployment_status with no open pull request, or a production deployment for a preview run."
    value: ${{ steps.scope.outputs.skip }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        # This step runs in the caller's repository; Sponson runs from its own install and must not start caching (or
        # failing on a missing lock file for) the caller's own dependencies.
        package-manager-cache: false

    # Resolve the PR/branch/sha for the scope.
    # pull_request: the PR itself. deployment_status: only an OPEN pull request associated with the deployed
    # commit; with none (the PR was merged or closed, or the branch never had one) the run is skipped, because
    # applying would re-create a preview that `destroy` already removed or that nothing will ever destroy.
    # A production deployment never drives a preview apply. push: no flags; the CLI reads the GitHub context.
    - id: scope
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SPONSON_ENV: ${{ inputs.env }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const ev = context.payload;
          let pr = null, branch = null, sha = null, skip = null;
          if (ev.pull_request) {
            pr = ev.pull_request.number; branch = ev.pull_request.head.ref; sha = ev.pull_request.head.sha;
          } else if (ev.deployment) {
            const target = String((typeof process !== "undefined" && process.env.SPONSON_ENV) || "preview").toLowerCase();
            const deployedTo = String(ev.deployment.environment ?? "").toLowerCase();
            if (deployedTo === "production" && target !== "production") {
              skip = `deployment to ${ev.deployment.environment} does not drive the ${target} environment`;
            } else {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: ev.deployment.sha });
              const open = data.find((p) => p.state === "open");
              if (open) {
                pr = open.number; sha = ev.deployment.sha;
                branch = /^[0-9a-f]{40}$/.test(ev.deployment.ref) ? open.head.ref : ev.deployment.ref;
              } else {
                skip = `no open pull request is associated with ${String(ev.deployment.sha).slice(0, 7)}; nothing to finish`;
              }
            }
          }
          if (skip) {
            // Empty scope outputs: a caller that ignores `skip` still passes no PR/branch/sha.
            core.setOutput("skip", "true");
            core.setOutput("reason", skip);
            const say = core.notice ?? core.info;
            if (say) say(`sponson: skipped (${skip})`);
            pr = null; branch = null; sha = null;
          }
          core.setOutput("pr", pr ?? "");
          core.setOutput("branch", branch ?? "");
          core.setOutput("sha", sha ?? "");

    - if: steps.scope.outputs.skip == 'true'
      shell: bash
      env:
        REASON: ${{ steps.scope.outputs.reason }}
      run: echo "::notice title=sponson skipped::$REASON"

    - id: run
      if: steps.scope.outputs.skip != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SPONSON_APPROVED_BY: ${{ inputs.approved-by }}
        SPONSON_RECEIPTS_REMOTE: https://x-access-token:${{ inputs.github-token }}@github.com/${{ github.repository }}.git
        SPONSON_RECEIPTS_DIR: ${{ runner.temp }}/sponson-receipts
        SCOPE_PR: ${{ steps.scope.outputs.pr }}
        SCOPE_BRANCH: ${{ steps.scope.outputs.branch }}
        SCOPE_SHA: ${{ steps.scope.outputs.sha }}
        # Inputs reach the script only as environment variables, never spliced into its text: a value containing
        # quotes or $(…) stays data (GitHub's guidance on script injection).
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_PLAN: ${{ inputs.plan }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set +e
        case "$INPUT_COMMAND" in
          plan)    cmd=(plan) ;;
          apply)   cmd=(apply) ;;
          destroy) cmd=(apply --destroy) ;;
          *) echo "::error::unknown command '$INPUT_COMMAND' (plan | apply | destroy)"; exit 2 ;;
        esac
        args=(--json --env "$INPUT_ENV")
        [ -n "$INPUT_PLAN" ] && args+=(--plan "$INPUT_PLAN")
        [ -n "$SCOPE_PR" ] && args+=(--pr "$SCOPE_PR")
        [ -n "$SCOPE_BRANCH" ] && args+=(--branch "$SCOPE_BRANCH")
        [ -n "$SCOPE_SHA" ] && args+=(--sha "$SCOPE_SHA")
        if [ "$INPUT_VERSION" = "source" ]; then
          # The action's checkout is this repository at the ref the caller pinned: build it, trust no registry.
          root="$(cd "$GITHUB_ACTION_PATH/.." && pwd)"
          if ! ( cd "$root" && corepack enable && pnpm install --frozen-lockfile ) >&2; then
            echo "::error::installing Sponson from the action's checkout failed"; exit 1
          fi
          # Run the sources through tsx, the same way the repository's own tests run the CLI. (Inside the
          # workspace the packages resolve to their TypeScript sources; only published packages point at dist/.)
          node_ts=(node --import "$root/node_modules/tsx/dist/loader.mjs")
          sponson=("${node_ts[@]}" "$root/packages/cli/src/bin.ts")
          render=("${node_ts[@]}")
          markdown_module="$root/packages/cli/src/markdown.ts"
        else
          # Installed into a directory of its own (not npx's cache), so the comment step can load its renderer too.
          prefix="$RUNNER_TEMP/sponson-cli"
          if ! npm install --prefix "$prefix" --no-save --no-audit --no-fund --loglevel=error "sponson@$INPUT_VERSION" >&2; then
            echo "::error::installing sponson@$INPUT_VERSION from npm failed"; exit 1
          fi
          sponson=("$prefix/node_modules/.bin/sponson")
          render=(node)
          markdown_module="$prefix/node_modules/sponson/dist/index.js"
        fi
        "${sponson[@]}" "${cmd[@]}" "${args[@]}" > "$RUNNER_TEMP/sponson-result.json"
        code=$?
        cat "$RUNNER_TEMP/sponson-result.json"
        # The PR comment: the markdown `--format markdown` prints, rendered by Sponson from the JSON saved above.
        rm -f "$RUNNER_TEMP/sponson-comment.md"
        RESULT_PATH="$RUNNER_TEMP/sponson-result.json" COMMENT_PATH="$RUNNER_TEMP/sponson-comment.md" \
          SPONSON_MARKDOWN_MODULE="$markdown_module" SPONSON_ENV="$INPUT_ENV" SPONSON_COMMAND="$INPUT_COMMAND" SPONSON_EXIT="$code" \
          "${render[@]}" "$GITHUB_ACTION_PATH/render-comment.mjs" >&2 || echo "::warning::sponson could not render the PR comment; posting a summary"
        # A random delimiter: output that happened to contain a fixed one could forge further step outputs.
        eof="SPONSON_$(openssl rand -hex 16)"
        {
          echo "result<<$eof"
          cat "$RUNNER_TEMP/sponson-result.json"
          echo "$eof"
          echo "exit=$code"
          echo "status=$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(r.receipt?(r.receipt.stale?"stale":r.receipt.status):(r.ok?"ok":"error"))' "$RUNNER_TEMP/sponson-result.json" 2>/dev/null || echo error)"
        } >> "$GITHUB_OUTPUT"
        exit 0

    - id: comment
      if: steps.scope.outputs.skip != 'true' && (github.event_name == 'pull_request' || steps.scope.outputs.pr != '')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COMMENT_PATH: ${{ runner.temp }}/sponson-comment.md
        SPONSON_ENV: ${{ inputs.env }}
        SPONSON_COMMAND: ${{ inputs.command }}
        SPONSON_EXIT: ${{ steps.run.outputs.exit }}
        SPONSON_PR: ${{ steps.scope.outputs.pr }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          // The body is Sponson's own markdown (render-comment.mjs, the `--format markdown` renderer), written by the
          // run step. One comment per environment, found by the marker it starts with and updated in place.
          const fs = require("fs");
          const env = process.env.SPONSON_ENV, command = process.env.SPONSON_COMMAND, exit = process.env.SPONSON_EXIT;
          const marker = `<!-- sponson:${String(env).replace(/[^A-Za-z0-9_.-]/g, "_")} -->`;
          const LIMIT = 65536;
          let body = "";
          try { body = fs.readFileSync(process.env.COMMENT_PATH, "utf8"); } catch { body = ""; }
          if (!body.trim()) {
            const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const word = String(command).replace(/[^a-z]/g, "") || "run";
            body = `${marker}\n### Sponson ${word} exited with ${String(exit).replace(/[^0-9]/g, "") || "an unknown code"}\n\nNo comment could be rendered for this run. The [run log](${run}) has the result.\n`;
          }
          if (!body.startsWith(marker)) body = `${marker}\n${body}`;
          if (body.length > LIMIT) body = body.slice(0, LIMIT - 2) + "\n…";

          const issue_number = context.payload.pull_request?.number ?? Number(process.env.SPONSON_PR);
          const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
          const mine = comments.find((c) => c.body?.startsWith(marker));
          if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ ...context.repo, issue_number, body });

    - if: steps.scope.outputs.skip != 'true'
      shell: bash
      env:
        SPONSON_EXIT: ${{ steps.run.outputs.exit }}
        INPUT_COMMAND: ${{ inputs.command }}
      run: |
        if [ "$SPONSON_EXIT" != "0" ]; then echo "::error::sponson $INPUT_COMMAND exited with $SPONSON_EXIT"; exit "$SPONSON_EXIT"; fi

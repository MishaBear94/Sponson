name: release

# Two steps, both driven by changesets (https://github.com/changesets/changesets):
#
# 1. On every push to main, open or update the "Version Packages" PR. It consumes .changeset/*.md, bumps
#    the four packages (they are `fixed`: one version for all) and writes their CHANGELOG.md files. Nothing
#    is published by this step.
# 2. A maintainer runs this workflow by hand (Actions → release → Run workflow) after merging that PR.
#    With `dry-run` (the default) it only prints what would be published. Without it, it publishes every
#    package whose version is not on npm yet with `pnpm publish` (via `changeset publish`: workspace:*
#    rewritten, publishConfig applied, prepack builds), with npm provenance, and pushes the git tags.
#
# Requires: repository secret NPM_TOKEN (an npm automation token), and a GitHub environment `npm`
# (Settings → Environments) with the maintainers as required reviewers.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only show what would be published
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-pr:
    if: github.event_name == 'push' && github.repository == 'MishaBear94/Sponson'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Open or update the Version Packages PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # No `publish:` here on purpose: publishing is a separate, manual, approved step.
          version-script: pnpm changeset version
          pr-title: Version Packages
          commit-message: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # push release tags
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - name: Refuse to publish with unreleased changesets
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -v README.md; then
            echo "::error::There are unconsumed changesets; merge the Version Packages PR first."
            exit 1
          fi
      - name: What would be published
        run: pnpm changeset publish-plan
      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: |
          pnpm changeset publish
          git push --follow-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

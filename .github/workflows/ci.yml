name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes the run for the previous push. Runs on main are never cancelled,
# so every merged commit gets a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          # The CLI shells out to git and spawns node for MCP; catch path and process differences.
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  coverage:
    # The thresholds live in vitest.config.ts (test.coverage.thresholds), so `pnpm test:coverage` fails the
    # same way locally as here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: vitest --coverage with thresholds
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["| metric | % | covered |", "|---|---|---|", ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

  action:
    # The composite action, run for real the way users run it, with its default `version: source` (built from this
    # checkout, nothing fetched from a registry), against the fake cloud. Push to main only: on pull requests the
    # action would comment, which this read-only workflow is not permitted to do.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: sim
      NEON_API_KEY: sim
      CLERK_SECRET_KEY: sim
      VERCEL_API_URL: http://127.0.0.1:4777/vercel
      NEON_API_URL: http://127.0.0.1:4777/neon
      CLERK_API_URL: http://127.0.0.1:4777/clerk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the fake cloud
        run: |
          nohup pnpm sim --port 4777 > "$RUNNER_TEMP/sim.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4777/_state > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/sim.log"; exit 1
      - name: A plan for the fake cloud
        run: |
          cat > release.plan.yaml <<'PLAN'
          version: 1
          receipts: local
          providers:
            vercel: { project: prj_demo }
            neon: { project: proj_demo }
          changes:
            - id: db
              adapter: neon
              op: branch
            - id: env
              adapter: vercel
              op: env
              target: preview
              values:
                DATABASE_URL: { from: db.connection_string }
          PLAN
      - id: sponson
        uses: ./action
        with:
          command: plan
      - name: The action built from source, planned, and reported through its outputs
        env:
          RESULT: ${{ steps.sponson.outputs.result }}
          STATUS: ${{ steps.sponson.outputs.status }}
          EXIT_CODE: ${{ steps.sponson.outputs.exit-code }}
        run: |
          test "$EXIT_CODE" = "0" && test "$STATUS" = "ok"
          node -e '
            const r = JSON.parse(process.env.RESULT);
            const lines = Object.fromEntries(r.lines.map((l) => [l.id, l.status]));
            if (lines.db !== "create" || lines.env !== "pending") throw new Error("unexpected plan: " + JSON.stringify(lines));
            if (!JSON.stringify(r).includes("sponson/preview/main")) throw new Error("expected the main scope branch name");
          '

  package:
    # Builds from a clean checkout and packs every package exactly as `pnpm publish` would (publishConfig
    # applied, workspace:* rewritten, prepack run), then installs the four tarballs into an empty project
    # and runs the CLI. Catches missing files, broken exports and dist/src mix-ups before a release does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build from clean
        run: |
          rm -rf packages/*/dist packages/*/*.tsbuildinfo
          pnpm build
      - name: Pack each package
        run: pnpm -r --filter './packages/*' exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"
      - name: Check tarball contents
        working-directory: ${{ runner.temp }}/packs
        run: |
          set -euo pipefail
          for t in *.tgz; do
            # List once and search the list: piping tar into `grep -q` kills tar with SIGPIPE when grep exits
            # early, and under pipefail that reads as "file missing".
            tar -tzf "$t" | sort > "$t.contents"
            echo "::group::$t"
            cat "$t.contents"
            echo "::endgroup::"
            for f in package/package.json package/README.md package/LICENSE package/dist/index.js package/dist/index.d.ts; do
              grep -qx "$f" "$t.contents" || { echo "::error::$t is missing $f"; exit 1; }
            done
            if grep -E '^package/(src/|.*\.test\.)' "$t.contents"; then echo "::error::$t ships sources or tests"; exit 1; fi
            if grep -F '.tsbuildinfo' "$t.contents"; then echo "::error::$t ships TypeScript build info"; exit 1; fi
            tar -xOzf "$t" package/package.json | node -e '
              const p = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const deps = JSON.stringify(p.dependencies ?? {});
              if (p.main !== "./dist/index.js") throw new Error(`${p.name}: main is ${p.main}, publishConfig not applied`);
              if (deps.includes("workspace:")) throw new Error(`${p.name}: workspace: protocol left in dependencies`);
            '
          done
      - name: Install the tarballs and run the CLI
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/packs/*.tgz
          test "$(npx --no-install sponson --version)" = "$(node -p 'require("'"$GITHUB_WORKSPACE"'/packages/cli/package.json").version')"
          node --input-type=module -e 'const m = await import("sponson"); if (typeof m.run !== "function") throw new Error("sponson does not export run")'
          node --input-type=module -e 'const m = await import("@sponson/adapters"); if (typeof m.createRegistry !== "function") throw new Error("no createRegistry")'
